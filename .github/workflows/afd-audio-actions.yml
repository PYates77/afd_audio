name: AFD Audio
run-name: AFD Audio

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo snap install htmlq

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pykokoro[cpu]"

      - name: Fetch AFD
        run: |
          curl -s "https://forecast.weather.gov/product.php?site=NWS&issuedby=FFC&product=AFD&glossary=1" \
            | htmlq 'pre.glossaryProduct' --text > afd.txt

      - name: Format AFD
        run: |
          awk -f afd.awk afd.txt

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Generate audio
        env:
          HF_HOME: ~/.cache/huggingface
        run: |
          python forecast_tts.py
      - name: Upload audio to Cloudflare R2
        run: |
          npx wrangler r2 object put afd-audio/forecast.wav \
            --file=output/forecast.wav \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
